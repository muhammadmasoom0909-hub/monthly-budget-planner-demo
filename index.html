/* Presentation only: all amounts come from saved plans and the selected transactions. */
function reportComparisonRows(months,transactions){
 const totals=new Map(months.map(m=>[m.month,{month:m.month,planned:m.spendingPlan,income:0,spent:0}]));
 for(const tx of transactions){const row=totals.get(E.monthOf(tx.date));if(!row)continue;if(tx.type==='income')row.income+=tx.amount;else if(tx.type==='expense')row.spent+=tx.amount;}
 return [...totals.values()];
}
function reportAxisTop(values){const largest=Math.max(1,...values),unit=10**Math.floor(Math.log10(largest));return [1,2,4,5,10].map(n=>n*unit).find(n=>n>=largest);}
function reportAxisMoney(cents){return new Intl.NumberFormat(state.settings.locale,{style:'currency',currency:state.settings.currency,notation:'compact',maximumFractionDigits:cents<100?2:1}).format(cents/100);}

function debtsView(){const occ=E.scheduled(state,month+'-01',E.monthEnd(month),true).filter(x=>x.kind==='debt');return pageHead('Debt Payments','A focused view of the payments that belong in your monthly budget.','Add debt','new-debt')+monthControl()+strip([['Remaining balance',money(E.sum(state.debts,d=>E.debtBalance(state,d.id)))],['Planned this month',money(E.sum(occ))],['Actually paid',money(E.sum(state.transactions.filter(t=>t.sourceKind==='debt'&&E.monthOf(t.date)===month)))]] )+`<div class="callout">${icon('info')}<span>Payments count once as expenses. Enter the principal portion when paying to track balance reduction accurately; interest is not calculated automatically.</span></div>${state.debts.length?`<div class="cards-grid">${state.debts.map(d=>{const dates=occ.filter(x=>x.sourceId===d.id),due=dates.find(x=>!x.paid),planned=E.plan(state,month).debtPayments?.[d.id]??d.amount,actual=E.sum(state.transactions.filter(t=>t.sourceKind==='debt'&&t.sourceId===d.id&&E.monthOf(t.date)===month));return`<article class="card commit-card"><div class="commit-head"><span class="category-icon">${icon('landmark')}</span><div class="rowmain"><b>${user(d.name)}</b><small>${d.apr?esc(d.apr)+'% APR':'Monthly payment plan'}</small></div>${pill(due?E.dueState(due.date):dates.length?'Paid':'No due date',due?dueTone(E.dueState(due.date)):'sage')}</div><div class="commit-amount num">${money(E.debtBalance(state,d.id))}</div><small class="muted">Remaining balance</small><div class="commit-meta"><span>Minimum payment</span><b>${money(d.amount)}</b></div><div class="commit-meta"><span>Planned payment</span><button class="linkbtn" data-act="debt-plan" data-id="${d.id}">${money(planned)} ${icon('pencil')}</button></div><div class="commit-meta"><span>Actual this month</span><b>${money(actual)}</b></div><div class="commit-meta"><span>Due date</span><b>${dateFmt(due?.date||dates.at(-1)?.date||nextOccurrence(d))}</b></div><div class="commit-meta"><span>${actual?'Paid from':'Default account'}</span><b>${accountLabel((actual?state.transactions.filter(t=>t.sourceId===d.id&&t.sourceKind==='debt'&&E.monthOf(t.date)===month).at(-1)?.accountId:'')||d.accountId)}</b></div><div class="commit-actions action-row"><div class="commit-primary">${due?btn('Record payment','pay','check','soft',`data-kind="debt" data-id="${d.id}" data-date="${due.date}"`):pill('No unpaid payment this month','sage')}</div><div class="commit-secondary">${ib('pencil','edit-commitment','Edit',`data-kind="debt" data-id="${d.id}"`)}</div></div><button class="delete-action" data-act="delete-commitment" data-kind="debt" data-id="${d.id}">${icon('trash-2')} Delete debt</button></article>`;}).join('')}</div>`:`<div class="card">${empty('Make space for your repayments','Add a debt balance and its minimum monthly payment.','Add debt','new-debt','landmark')}</div>`}`;}
function calendarAgendaAction(i){if(i.kind==='event')return`<button class="linkbtn" data-act="edit-event" data-id="${i.id}">Edit event</button><button class="linkbtn negative" data-act="delete-event" data-id="${i.id}">Delete</button>`;if(i.txId)return['bill','subscription','debt'].includes(i.kind)?`<button class="linkbtn" data-act="delete-tx" data-id="${i.txId}">Delete payment to reopen</button>`:`<button class="linkbtn" data-act="edit-tx" data-id="${i.txId}">View entry</button>`;if(['bill','subscription','debt'].includes(i.kind)&&!i.paid&&(i.kind==='debt'||E.canPay(state,i.kind,i.sourceId,i.date)))return`<button class="linkbtn" data-act="pay" data-kind="${i.kind}" data-id="${i.sourceId}" data-date="${i.date}">${i.kind==='bill'?'Pay bill':'Record payment'}</button>`;if(i.kind==='expected')return`<button class="linkbtn" data-act="receive" data-id="${i.id}">Record income</button>`;if(i.kind==='contribution')return`<button class="linkbtn" data-act="target-contribute" data-id="${i.targetId||''}">Contribute</button>`;return'';}
function calendarView(){const events=E.agenda(state,month),first=month+'-01',[y,m]=month.split('-').map(Number),offset=(new Date(y,m-1,1).getDay()+6)%7,start=E.dateAdd(first,-offset),cells=Math.ceil((offset+ +E.monthEnd(month).slice(8))/7)*7,selected=events.filter(x=>x.date===day);return pageHead('Your financial calendar','Income, commitments, and contributions, together in one monthly view.','Add event','new-event')+monthControl()+`<div class="calendar-layout"><section class="card"><div class="calendar-week">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar-grid">${Array.from({length:cells},(_,i)=>{const d=E.dateAdd(start,i),ev=events.filter(x=>x.date===d);return`<button class="calendar-day ${E.monthOf(d)!==month?'outside':''} ${d===day?'selected':''} ${d===E.today()?'today':''}" data-act="select-day" data-date="${d}" aria-label="${esc(dateFmt(d))}, ${ev.length} events"><span class="daynum">${+d.slice(8)}</span>${ev.slice(0,3).map(e=>`<span class="cal-event ${e.kind}" title="${user(e.name)}">${user(e.name)}</span>`).join('')}${ev.length>3?`<span class="cal-more">+${ev.length-3} more</span>`:''}</button>`;}).join('')}</div><div class="legend"><span><i class="dot positive"></i> Income</span><span><i class="dot negative"></i> Spending & bills</span><span><i class="dot gold"></i> Savings & targets</span></div></section><aside class="card card-pad calendar-agenda"><div class="cardhead"><h2>${dateFmt(day,true)}</h2>${ib('plus','new-event','Add event on this day')}</div>${selected.length?selected.map(i=>`<div>${upcomingRow(i)}<div class="calendar-item-actions">${calendarAgendaAction(i)}</div></div>`).join(''):empty('A clear day','Choose another date or add a financial reminder.','','','calendar-check',true)}</aside></div>`;}
function reportRange(){const current=month;if(reportPeriod==='custom')return[reportFrom,reportTo];if(reportPeriod==='last')return[E.monthAdd(current,-1)+'-01',E.monthEnd(E.monthAdd(current,-1))];if(reportPeriod==='3')return[E.monthAdd(current,-2)+'-01',E.monthEnd(current)];if(reportPeriod==='6')return[E.monthAdd(current,-5)+'-01',E.monthEnd(current)];if(reportPeriod==='year')return[current.slice(0,4)+'-01-01',current.slice(0,4)+'-12-31'];return[current+'-01',E.monthEnd(current)];}
function reportsView(){const[start,end]=reportRange(),months=[];for(let m=E.monthOf(start);m<=E.monthOf(end)&&months.length<123;m=E.monthAdd(m,1))months.push(m);const ms=months.map(m=>E.monthly(state,m)),tx=state.transactions.filter(t=>t.date>=start&&t.date<=end),spent=E.sum(tx.filter(t=>t.type==='expense')),received=E.sum(tx.filter(t=>t.type==='income')),saved=E.netSaved(state,tx),planned=E.sum(ms,x=>x.spendingPlan),cats=state.categories.filter(c=>c.type==='expense').map(c=>({...c,amount:E.sum(tx.filter(t=>t.type==='expense'&&t.categoryId===c.id)),planned:E.sum(ms,m=>E.sum(m.plan.allocations.filter(a=>a.categoryId===c.id)))})).filter(c=>c.amount||c.planned).sort((a,b)=>b.amount-a.amount);const comparisons=reportComparisonRows(ms,tx),data=tx.length||ms.some(m=>m.planned||m.expected);return pageHead('Reports & Analytics','Understand how closely your spending follows your intentions.','Print report','print','printer')+monthControl()+`<div class="toolbar"><select aria-label="Report period" data-change="report-period">${options([['this','Selected month'],['last','Previous month'],['3','Last 3 months'],['6','Last 6 months'],['year','Selected year'],['custom','Custom range']],reportPeriod)}</select>${reportPeriod==='custom'?`<label>From <input type="date" value="${reportFrom}" data-change="report-from"></label><label>To <input type="date" value="${reportTo}" data-change="report-to"></label>`:''}<span class="small muted">${dateFmt(start)} – ${dateFmt(end)}</span></div>${strip([['Income received',money(received),'','positive'],['Actual spending',money(spent)],['Savings contributions',money(saved),'Net of withdrawals and funded expenses'],['Budget variance',money(planned-spent),'Monthly plans − selected expenses',planned-spent<0?'negative':'positive']])}${!data?`<div class="card">${empty('Your numbers will tell a story','Plan a month or record a transaction to start your budget review.','Plan this month','budget-go','chart-no-axes-combined')}</div>`:`<div class="report-grid">${comparisonReport('plan',comparisons)}${comparisonReport('cash',comparisons)}<section class="card card-pad category-spend-card"><div class="cardhead"><div><h2>Spending by category</h2><p>Share of actual expenses in this period</p></div></div>${cats.filter(c=>c.amount).length?cats.filter(c=>c.amount).map(c=>{const share=spent?c.amount/spent*100:0;return`<div class="category-spend-row"><div class="category-spend-label"><span class="category-icon">${icon(c.icon)}</span><div class="rowmain"><b>${categoryText(c)}</b><small>${Math.round(share)}% of spending</small></div><strong class="num">${money(c.amount)}</strong></div>${segmentedMeter(share)}</div>`;}).join(''):empty('No expenses in this period','Recorded expenses will appear here.','','','shopping-bag',true)}</section><section class="card card-pad"><div class="cardhead"><h2>Budget performance & variance</h2></div>${cats.map(c=>`<div class="list-row"><div class="rowmain"><b>${categoryText(c)}</b><small>${money(c.planned)} planned · ${money(c.amount)} spent</small></div><span class="num ${c.planned-c.amount<0?'negative':'positive'}">${money(c.planned-c.amount)}</span></div>`).join('')||'<p class="muted small">No category allocations yet.</p>'}<p class="inline-hint">${planned?`Spending used ${Math.round(spent/planned*100)}% of your plan. Variance is ${Math.round(Math.abs(planned-spent)/planned*100)}% of planned spending.`:'Add allocations to measure budget accuracy.'}</p></section>${visible('savings')?`<section class="card card-pad"><div class="cardhead"><h2>Savings progress</h2></div>${ms.map(m=>`<div class="report-row"><div class="report-label"><b>${monthShort(m.month)}</b><span class="num">${money(m.saved)} / ${money(m.savingsPlan)}</span></div>${meter(m.savingsPlan?m.saved/m.savingsPlan*100:0,'gold')}</div>`).join('')}</section>`:''}${visible('funds')?`<section class="card card-pad"><div class="cardhead"><h2>Sinking fund progress</h2></div>${state.targets.filter(t=>t.kind==='fund'&&!t.archived).map(t=>{const b=E.targetBalance(state,t.id,end);return`<div class="report-row"><div class="report-label"><b>${user(t.name)}</b><span>${money(b)} / ${money(t.target)}</span></div>${meter(b/t.target*100,'gold')}</div>`;}).join('')||empty('No sinking funds yet','Create a fund for a future expense.','','','vault',true)}</section>`:''}${visible('bills')||visible('subscriptions')?`<section class="card card-pad"><div class="cardhead"><h2>Bills & subscriptions</h2></div>${['bill','subscription'].filter(k=>visible(k==='bill'?'bills':'subscriptions')).map(k=>{const sc=E.scheduled(state,start,end,true).filter(x=>x.kind===k);return`<div class="list-row"><div class="rowmain"><b>${k==='bill'?'Bills':'Subscriptions'}</b><small>${sc.filter(x=>x.paid).length} of ${sc.length} scheduled payments recorded</small></div><strong class="num">${money(E.sum(sc,x=>x.paid?(x.actualAmount??x.amount):x.amount))}</strong></div>`;}).join('')}<p class="inline-hint">Commitment totals include expected unpaid amounts and preserved actual payments. Expense totals use paid transactions only.</p></section>`:''}</div>`}${reportPeriod==='custom'?'<p class="inline-hint">For partial months, planned budgets use full monthly amounts. Actual income and expenses in the charts follow the exact selected dates.</p>':''}`;}
function historyView(){const months=[...new Set([...state.plans.map(p=>p.month),...state.transactions.map(t=>E.monthOf(t.date))])].sort().reverse();return pageHead('Budget History','A month-by-month record of your plans, progress, and adjustments.')+(months.length?`<div class="cards-grid">${months.map(m=>{const x=E.monthly(state,m);return`<article class="card history-card"><div class="history-state"><h3>${monthLabel(m)}</h3>${pill(x.plan.reviewed?'Reviewed':m<E.monthOf(E.today())?'Completed':'In progress',x.plan.reviewed?'sage':'gold')}</div><small class="muted">${x.remaining>=0?'Under spending budget':'Over spending budget'}</small><div class="history-amount num ${x.remaining<0?'negative':'positive'}">${money(Math.abs(x.remaining))}</div><div class="history-grid">${[['Planned spending',x.spendingPlan],['Actual spending',x.spent],['Income received',x.received],['Saved',x.saved]].map(([l,v])=>`<div><small>${l}</small><b class="num">${money(v)}</b></div>`).join('')}</div><div style="margin-top:23px">${btn('Review month','history-open','arrow-up-right','small soft',`data-month="${m}"`)}</div></article>`;}).join('')}</div>`:`<div class="card">${empty('Your monthly story starts here','Saved plans and transactions automatically create a monthly history.','Plan your first month','budget-go','history')}</div>`);}

 if(setting==='navigation')return`<h2>Navigation Management</h2><p class="settings-intro">Hidden modules preserve their data. Their alerts and optional widgets are hidden; recorded financial activity remains in accurate totals.</p>${settingRow('Dashboard & Settings','Always available.','<span class="pill sage">Essential</span>')}${Object.keys(routes).filter(x=>!['dashboard','settings','categories'].includes(x)).map(r=>settingRow(routes[r][0],`Show ${routes[r][0].toLowerCase()} in your workspace.`,switcher(r,visible(r),'navigation',routes[r][0]))).join('')}`;
 if(setting==='categories')return categoriesSettings();

 if(setting==='notifications'){const days=(key,values)=>`<div class="checks">${values.map(d=>`<label class="checkchip"><input type="checkbox" data-change="notify-day" data-key="${key}" value="${d}" ${n[key].includes(d)?'checked':''}>${d===0?'Due today':d<0?'Overdue':`${d}d before`}</label>`).join('')}</div>`;return`<h2>Notifications</h2><p class="settings-intro">In-app reminders are checked while the planner is open. Read and dismissed alerts keep their state.</p>${settingRow('Master notifications','Pause every new in-app reminder without changing the category choices below.',switcher('enabled',n.enabled,'notify','Master notifications'))}<div class="notification-settings ${n.enabled?'':'muted-settings'}">${settingRow('Bills','Monthly-or-longer schedules offer 5, 3 and 1 day reminders. Weekly and biweekly schedules use 1 day before.',switcher('bills',n.bills,'notify'))}${days('billDays',[5,3,1,0,-1])}${settingRow('Subscription payments','Only active, unpaid billing cycles create alerts.',switcher('subscriptions',n.subscriptions,'notify'))}${days('subscriptionDays',[5,3,1,0,-1])}<h3 class="section-title">Free trial reminders</h3>${days('trialDays',[5,3,1,0])}${settingRow('Budget alerts','Monitor the current calendar month’s spending categories.',switcher('budget',n.budget,'notify'))}${settingRow('Near limit','When category spending reaches 80%.',switcher('near',n.near,'notify'))}${settingRow('Over budget','When actual spending exceeds the category allocation.',switcher('over',n.over,'notify'))}${settingRow('Contribution reminders','On the planned contribution date when money is still to be set aside.',switcher('contributions',n.contributions,'notify'))}${settingRow('Milestones','When an active goal or fund reaches 50%.',switcher('milestones',n.milestones,'notify'))}${settingRow('Target reached','When recorded savings reach an active target.',switcher('reached',n.reached,'notify'))}${settingRow('Debt payment reminders','Advance, due-today and one persistent overdue reminder.',switcher('debt',n.debt,'notify'))}${days('debtDays',[5,3,1,0,-1])}${settingRow('Backup reminder','A gentle reminder after 30 days without a backup.',switcher('backup',n.backup,'notify'))}</div>`;}
 if(setting==='data')return`<h2>Privacy & Data</h2><div class="workspace-stats">${state.accounts.length} accounts · ${state.transactions.length} transactions · ${state.plans.length} monthly plans</div><p class="settings-intro">Financial records stay in this browser’s IndexedDB. No login, bank connection, or automatic cloud sync.</p><div class="data-box"><h3>Protect your progress</h3><p>Create a backup before clearing browser data or moving the app. Backups contain your financial records in readable JSON; store them somewhere private. PIN credentials are not included.</p><div class="actions">${btn('Create backup','backup','download','primary')}${btn('Restore backup','restore','upload')}</div><p style="margin-bottom:0">Last backup: ${s.lastBackup?dateFmt(s.lastBackup):'Not created yet'}</p></div><div class="data-box"><h3>Export your activity</h3><p>Download all transactions as a CSV file for your own records.</p>${btn('Export transactions CSV','export-all','file-spreadsheet')}</div><div class="data-box"><h3>Clear financial data</h3><p>Remove accounts, transactions, plans, commitments, targets, events, and alerts. Keep categories, preferences, and your PIN.</p>${btn('Clear financial data','clear-financial','trash-2','danger')}</div><div class="data-box"><h3>Delete all app data</h3><p>Reset this product, including custom categories, preferences, and PIN. Your other finance products are not affected.</p>${btn('Delete all app data','clear-all','trash-2','danger')}</div>`;
 if(setting==='demo')return`<h2>Interactive Demo</h2><p class="settings-intro">Explore the complete monthly budgeting workflow with realistic current-date sample data.</p><div class="data-box demo-info-card"><h3>Safe public demo</h3><p>This demo stores only sample-session changes in this browser tab. It does not upload visitor data.</p><div class="callout">${icon('shield-check')}<span>Demo uses sample data. Please do not enter real financial information.</span></div></div><div class="data-box"><h3>Session controls</h3><p>Reset the demo at any time to restore the full current-date sample workspace.</p>${btn('Reset Demo','reset-demo','refresh-cw','primary')}</div><div class="data-box"><h3>Purchased-version tools</h3><p>Backup import, full backup export, PIN security, and global data deletion are disabled here to protect visitors. CSV export remains available and contains demo-session records only.</p>${pill('Available in the purchased version','gold')}</div>`;
 if(setting==='security')return`<h2>Security</h2><p class="settings-intro">An optional local screen lock for your workspace. PIN protection is off by default.</p>${settingRow('PIN protection',security?'Your workspace locks when you reopen or reload the app.':'Use a 4–8 digit PIN to lock the interface.',security?pill('Enabled','sage'):pill('Off'))}<div class="data-box"><h3>${security?'Manage your PIN':'Add a little privacy'}</h3><p>The PIN is a local app lock, not database encryption. Anyone with access to this browser’s storage or an exported backup may be able to read records.</p><div class="actions">${security?btn('Change PIN','pin-change','key-round')+btn('New recovery key','recovery-new','refresh-cw')+btn('Lock now','lock','lock-keyhole')+btn('Turn off PIN','pin-off','shield-off','danger'):btn('Set up PIN','pin-setup','shield-check','primary')}</div></div><div class="data-box"><h3>Recovery key</h3><p>Save your recovery key outside the app. It can unlock your workspace if you forget your PIN. Without either, the only recovery is resetting the app and restoring a backup.</p></div>`;
 return`<h2>About & Help</h2><p class="settings-intro">Monthly Budget Planner · Version 1.4.0 · Offline browser edition</p><div class="help-start"><div><span>1</span><b>Plan</b><small>Add accounts, expected income, and the month’s allocations.</small></div><div><span>2</span><b>Record</b><small>Enter real income, expenses, payments, and savings once.</small></div><div><span>3</span><b>Review</b><small>Use Dashboard, Reports, and Budget History to close the month.</small></div></div><div class="help">${[
 ['A simple monthly workflow','Choose a month. Plan expected income. Allocate spending categories and savings. Record actual income and expenses as they happen. Review the month, then copy its plan into the next one.'],
 ['Navigation guide','Everyday Money contains Income, Expenses, Transactions, and Accounts. Monthly Planning contains Monthly Budget, Bills, Subscriptions, Savings, Goals, and Sinking Funds. Commitments contains Debt Payments and Calendar. Insights contains Reports & Analytics and Budget History. Settings controls preferences, categories, reminders, backups, security, and this help guide.'],
 ['Reading the Dashboard','Money Left is the main month result. Budget Health shows how much of the spending plan is used. Category Snapshot highlights leading allocations. The Cash Plan explains income, allocations, actual spending, and what remains. Coming Up prioritizes unpaid commitments. Activity shows only the latest entries; open Transactions for the complete history. Accounts appear last because they show where money lives, not how the monthly plan is performing.'],
 ['Using Monthly Budget','Expected income is planned before it arrives. Spending allocations give categories a limit. Savings allocations reserve part of the plan. Remaining to Allocate tells you whether planned income still needs a purpose; Remaining to Spend tells you how much of the spending budget is unused. Edit an allocation directly, or copy the previous month to start faster.'],
 ['Getting started & your data','Open index.html after extracting the complete download. Use a regular browser window and keep the file in the same location. Browser storage belongs to this browser and device. Private browsing, clearing site data, changing browser, or moving the file can affect access. Create backups regularly.'],
 ['Understanding the three remaining amounts','Remaining to allocate = planned income minus spending and savings allocations. Remaining to spend = category spending allocations minus actual expenses. Money left = income actually received minus expenses and net money set aside in that month. It is not a live bank balance; earlier-month cash is not included.'],
 ['Accounts & transfers','Add cash, bank, savings, or wallet accounts. Set the opening balance before the first transaction on its opening date. Opening balances are not income. Choose an account for actual entries; payments deduct once. Transfers move money between accounts without changing income or expenses. Older entries remain Unassigned until you link them. Archive accounts to preserve history.'],
 ['Income & categories','Expected income is a plan, not money received. Use Receive to link actual income to the planned source. Expense categories are available immediately in Monthly Budget. Archive a used category to keep it in history while removing it from new-entry choices. Archived categories can be restored.'],
 ['Bills & subscriptions','Create each bill or subscription once. Every due occurrence or billing cycle keeps its expected amount, actual payment, date, account, and history. Payments are locked after confirmation; delete the linked payment to reverse its account and expense effect and reopen only that occurrence. Pause preserves history, Resume asks for the next real date, and End or Cancel stops future cycles and reminders. Free trials never create automatic expenses.'],
 ['Savings vs. goals vs. sinking funds','Savings are money already put aside. A goal is a broader target. A sinking fund prepares for a future expense. Record one savings entry and link it to a target when useful. Opening savings represent existing funds and never count as income or money saved this month. A withdrawal returns money to monthly cash; record the eventual purchase separately as an expense.'],
 ['Using saved money','Accounts show where money is held; savings targets describe what part is reserved. Target opening amounts do not add money to an account. When moving savings, choose both accounts in one savings entry. For a purchase funded by a goal or fund, select that target in Use saved money on the expense. This releases its reserved amount and records one expense. Do not also record a withdrawal for that same purchase.'],
 ['Planning contributions','A target’s monthly intention is a suggested amount. Add it to the selected month using Plan contribution. Contributions can be made in parts. The monthly plan controls reminders and allocations, while savings entries record what actually happened.'],
 ['Completing goals and sinking funds','When recorded savings reach the target, Contribute becomes Archive completed. Archiving removes the finished card from the active list without deleting its saved amount, contributions, or linked records. Open Archived goals or Archived funds to restore it.'],
 ['Debt payments','Set the balance, minimum payment, and due date. Change the planned payment for an individual month. A payment becomes one expense; the principal portion reduces the debt balance. Enter interest or fees by setting principal below the total payment. This app does not calculate interest or amortization.'],
 ['Calendar & notifications','The calendar reads source records without duplicating them. Bills and subscriptions use frequency-aware payment windows, so a reminder never appears while its payment action is locked. Notifications are in-app only and checked while the planner is open. Read and dismissed alerts keep their state; paid, paused, ended, and cancelled schedules stop active reminders.'],
 ['Reports & budget history','Reports use saved data and selected periods. Monthly plans create history automatically. Historical months remain editable. Mark reviewed records that you have checked; this does not lock them. Copy previous month transfers plans, not transactions. There is no automatic cash rollover.'],
 ['Editing, deleting, and linked payments','Ordinary entries can be edited or deleted and their old financial effect is reversed first. Paid bills and subscriptions use one locked linked expense. Delete that linked transaction only when you genuinely need to reverse the payment; the matching occurrence reopens and the account effect is restored exactly once. Historical categories, accounts, completed goals, and paid schedules should be archived or ended instead of destructively removed.'],
 ['Backup & restore','Create a JSON backup in Privacy & Data. Restore validates the file and shows a summary before replacing financial data. The current PIN remains unchanged. Export CSV is useful for records, but CSV is not a restorable backup. Old products use different schemas and cannot be restored as Monthly Budget Planner backups.'],
 ['PIN & recovery','PIN protection locks the interface and is not encryption. Keep the recovery key safe. A new key invalidates the previous one. After too many failed attempts, wait one minute. Recovery unlocks the app so you can change your PIN or turn it off.'],
 ['Troubleshooting','If a save fails, your last saved state remains intact; retry after checking browser storage availability. If another tab changes data, reload before saving. A backup is the reliable way to move to another browser. For a blank screen, use a current browser with JavaScript and IndexedDB enabled. No internet connection is required.'],
 ['Mobile and tablet use','On mobile, use the bottom bar for Dashboard, Budget, Quick Add, Transactions, and More. More contains the complete module directory and Settings. Forms use touch-sized controls and keep Save available near the bottom. On tablets, Settings sections may appear as a horizontal scrollable row. Your data still belongs to that browser and device, so use Backup and Restore when moving between devices.'],
 ['Currency, language & accessibility','Choose English, Spanish, or French. Number formatting follows the selected currency automatically; date format remains your choice. Changing currency relabels amounts without conversion. Theme, text size, reduced motion, zoom, keyboard navigation, and touch-friendly controls are supported.']
 ].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`;
}
function options(list,selected){return list.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(l)}</option>`).join('');}
function field(name,label,value='',type='text',extra='',hint=''){if(type==='hidden')return`<input type="hidden" name="${name}" value="${esc(value)}">`;return`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>${hint?`<small>${hint}</small>`:''}</div>`;}
function selectField(name,label,list,value,extra=''){return`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" ${extra}>${options(list,value)}</select></div>`;}
const amountField=(name,label,v,required=true)=>field(name,label,amountInput(v),'text',`inputmode="decimal" data-money ${required?'required':''} autocomplete="off" placeholder="${amountInput(0)}"`).replace('</div>',`<output class="money-preview" data-preview-for="${name}">${v===undefined?'':money(v)}</output></div>`);
const dateField=(name,label,v)=>field(name,label,v,'date','required min="1900-01-01" max="2200-12-31"');
const nameField=(label,v)=>field('name',label,v,'text','required maxlength="120" autocomplete="off"');
function catOptions(type,old){return state.categories.filter(c=>c.type===type&&(!c.archived||c.id===old)).map(c=>[c.id,(E.defaults().categories.some(x=>x.id===c.id&&x.name===c.name)?c.name:'\uE000'+c.name+'\uE001')+(c.archived?' (archived)':'')]);}
function targetOptions(old){return[['','General savings'],...state.targets.filter(t=>t.status!=='paused'||t.id===old).map(t=>[t.id,`\uE000${t.name}\uE001 (${t.kind==='fund'?'sinking fund':'goal'})`])];}
const entryDate=()=>month===E.monthOf(E.today())?E.today():month+'-01';
function moreOptions(t={},extra=''){return`<details ${t.method||t.note||extra?'open':''}><summary>More options</summary>${field('method','Payment method',t.method||'','text','maxlength="80" list="payment-methods"')}<datalist id="payment-methods"><option>Debit card</option><option>Credit card</option><option>Cash</option><option>Bank transfer</option><option>Direct debit</option></datalist><div class="field"><label for="f-note">Notes</label><textarea id="f-note" name="note" maxlength="1000">${esc(t.note||'')}</textarea></div>${extra}</details>`;}
function openDrawer(title,subtitle,content,form='',meta='',modal=false){if(!$('#overlay').firstChild)lastFocus=document.activeElement;$('#overlay').innerHTML=`<div class="overlay ${modal?'modal-overlay':''}"><section class="drawer ${modal?'modal':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="drawer-head"><div><h2 id="dialog-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div>${ib('x','close','Close dialog')}</div>${form?`<form class="form" data-form="${form}" ${meta}><div class="form-error" role="alert"></div>${content}<div class="form-actions">${btn('Cancel','close')}<button type="submit" class="button primary">${form==='confirm'?'Confirm':form==='payment'?'Record payment':form==='copy'?'Copy plan':'Save'}</button></div></form>`:content}</section></div>`;document.body.style.overflow='hidden';localize();requestAnimationFrame(()=>{const el=$('#overlay input:not([type=hidden])')||$('#overlay select')||$('#overlay button');el?.focus();});}
function closeDrawer(){if(busy)return;$('#overlay').innerHTML='';document.body.style.overflow='';lastFocus?.isConnected&&lastFocus.focus();}
function quick(){openDrawer('Quick Add','A few details. Everything stays connected.',`<div class="quick-grid">${[['new-account','Account','landmark','Add cash, bank, or savings.','accounts'],['new-transfer','Transfer','arrow-left-right','Move money between accounts.','accounts'],['new-expense','Expense','shopping-bag','Record money spent.','expenses'],['new-income','Income','arrow-down-left','Record money received.','income'],['new-saving','Savings','piggy-bank','Set some money aside.','savings'],['new-bill','Bill','receipt-text','Plan an upcoming payment.','bills'],['allocation','Allocation','notebook-pen','Give a category a budget.','budget'],['new-event','Calendar event','calendar-plus','Remember a financial date.','calendar']].filter(x=>visible(x[4])).map(([a,t,i,d])=>`<button class="quick-item" data-act="${a}">${icon(i)}<b>${t}</b><small>${d}</small></button>`).join('')}</div>`);}
function txForm(type='expense',id='',extra={}){const old=state.transactions.find(x=>x.id===id),t=old||{type,date:entryDate(),...extra};type=t.type;if(type==='transfer')return transferForm(id);if(!old&&!activeAccounts().length){pendingEntry=()=>txForm(type,id,extra);accountForm();toast('Add an account first to track this entry.');return;}const saving=['saving','withdrawal'].includes(type),title=old?'Edit entry':({income:'Record income',expense:'Add expense',saving:'Record savings',withdrawal:'Record withdrawal'})[type];const linked=!!t.sourceId;openDrawer(title,linked?'This entry is linked to a scheduled payment. Changes update it everywhere.':saving?'Move money into or out of savings without creating an expense.':'Enter the essentials. Add more detail only when you need it.',`${field('type','',type,'hidden')}${type==='expense'?field('name','Payee / description (optional)',t.name||'','text','maxlength="120" autocomplete="off"'):nameField(type==='income'?'Income source':'Entry name',t.name||(type==='saving'?'Savings contribution':'Savings withdrawal'))}<div class="form-row">${amountField('amount','Amount',t.amount)}${dateField('date','Date',t.date)}</div>${saving?selectField('targetId','Linked goal or sinking fund',targetOptions(t.targetId),t.targetId||''):selectField('categoryId','Category',catOptions(type,t.categoryId),t.categoryId||catOptions(type)[0]?.[0],'required')}${accountFormFields(t,type)}${type==='expense'?selectField('savingsTargetId','Use saved money (optional)',[['','Not funded by a savings target'],...state.targets.map(x=>[x.id,'\uE000'+x.name+'\uE001'])],t.savingsTargetId||''):''}${type==='income'?selectField('incomePlanId','Expected income source (optional)',[['','Unplanned / not linked'],...state.plans.flatMap(p=>p.income.map(i=>[i.id,`\uE000${i.name}\uE001 · ${monthShort(p.month)}`]))],t.incomePlanId||''):''}${t.sourceKind==='debt'?amountField('principal','Principal portion (reduces debt balance)',t.principal??t.amount):''}${moreOptions(t)}${saving?'<p class="inline-hint">Withdrawals return money to cash. Record any purchase separately as an expense.</p>':''}`,'transaction',`data-id="${id}"`);}
function incomePlanForm(id=''){const i=E.plan(state,month).income.find(x=>x.id===id)||{date:entryDate()};openDrawer(id?'Edit expected income':'Plan income',`Expected income for ${monthLabel(month)}.`,`${nameField('Income source',i.name||'')}<div class="form-row">${amountField('amount','Expected amount',i.amount)}${dateField('date','Expected date',i.date)}</div>${selectField('categoryId','Income category',catOptions('income',i.categoryId),i.categoryId||'inc-0')}<label class="checkchip"><input type="checkbox" name="recurring" ${i.recurring?'checked':''}>Regular income source</label>${moreOptions(i)}`,'income-plan',`data-id="${id}"`);}
function allocationForm(){const allocated=new Set(E.plan(state,month).allocations.map(x=>x.categoryId)),cats=state.categories.filter(c=>c.type==='expense'&&!c.archived&&!allocated.has(c.id));openDrawer('Add category allocation',`Give part of ${monthLabel(month)}’s income a purpose.`,cats.length?`${selectField('categoryId','Category',cats.map(c=>[c.id,categoryLabel(c)]),cats[0].id)}${amountField('amount','Monthly budget')}<p class="inline-hint">Custom expense categories appear here automatically. Existing allocations can be edited directly in the budget table.</p>`:empty('Every active category has an allocation','Edit the amounts in Monthly Budget or create another category.','Create category','new-category','shapes',true),cats.length?'allocation':'');}
function contributionForm(id=''){const c=E.plan(state,month).contributions.find(x=>x.id===id)||{},t=E.target(state,c.targetId);openDrawer('Plan savings contribution',`Reserve money in ${monthLabel(month)}’s plan.`,`${selectField('targetId','Save toward',targetOptions(c.targetId),c.targetId||'')}${amountField('amount','Planned amount',c.amount??t?.monthly)}${field('day','Contribution day',c.day||1,'number','required min="1" max="31"','For shorter months, the last valid date is used.')}`,'contribution-plan',`data-id="${id}"`);}
function categoryForm(id='',defaultType='expense'){const c=state.categories.find(x=>x.id===id)||{};openDrawer(id?'Edit category':'New category','Make the categories fit the way you live.',`${nameField('Category name',c.name||'')}${selectField('type','Category type',[['expense','Expense'],['income','Income']],c.type||defaultType,id?'disabled':'')}${selectField('icon','Icon',[['shapes','General'],['repeat-2','Subscriptions'],['landmark','Debt / banking'],['house','Home'],['shopping-basket','Groceries'],['car','Transport'],['zap','Utilities'],['utensils','Dining'],['heart-pulse','Health'],['shopping-bag','Shopping'],['clapperboard','Entertainment'],['briefcase-business','Work'],['gift','Gifts'],['graduation-cap','Education'],['plane','Travel'],['paw-print','Pets']],c.icon||'shapes')}`,'category',`data-id="${id}"`);}
function commitmentForm(kind,id=''){const item=commitmentList(kind).find(x=>x.id===id)||{},debt=kind==='debt',sub=kind==='subscription',bill=kind==='bill',freq=debt?[['monthly','Monthly']]:bill?[['once','One time'],['weekly','Weekly'],['fortnightly','Every 2 weeks'],['monthly','Monthly'],['bimonthly','Every 2 months'],['quarterly','Quarterly'],['semiannual','Every 6 months'],['annual','Yearly']]:[['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['semiannual','Every 6 months'],['annual','Yearly']],frequency=item.frequency||'monthly',start=item.startDate||item.date||entryDate(),trial=item.trialType||'none';const schedule=sub?`${dateField('startDate','Service start date',start)}${selectField('trialType','Free trial',[['none','No trial'],['oneMonth','1 month'],['threeMonths','3 months'],['custom','Custom end date']],trial,'data-change="trial-type"')}<div class="trial-fields" ${trial==='none'?'hidden':''}>${field('trialEndDate','Trial end date',item.trialEndDate||'','date','min="1900-01-01" max="2200-12-31"','Calculated automatically for 1- and 3-month trials; editable for a custom trial.')}</div>${dateField('date','First / next paid billing date',item.date||entryDate())}`:`<div class="form-row">${dateField('date',debt?'First due date':'Due date',item.date||entryDate())}${dateField('startDate','Start date',start)}</div>`;openDrawer(id?'Edit '+kind:'Add '+kind,debt?'Plan the payment; record it when you pay.':sub?'Create the service once; every paid billing cycle keeps its own history.':'Create the bill once; each due occurrence keeps its own payment record.',`${nameField(debt?'Debt name':bill?'Bill name':'Service name',item.name||'')}${debt?amountField('balance','Starting balance',item.balance):''}${amountField('amount',debt?'Minimum monthly payment':sub?'Fixed plan amount':'Expected amount',item.amount)}${schedule}${selectField('frequency','Frequency',freq,frequency)}${!debt?field('endDate','Optional end date',item.endDate||'','date','min="1900-01-01" max="2200-12-31"'):''}${selectField('categoryId','Expense category',catOptions('expense',item.categoryId),item.categoryId||(debt?'cat-9':sub?'cat-8':'cat-3'))}${debt?field('apr','APR % (optional)',item.apr||'','number','min="0" max="100" step="0.01"'):''}${selectField('accountId','Payment account',accountOptions(item.accountId,'Choose when paying'),item.accountId||'')}${moreOptions(item)}${debt?'<p class="inline-hint">Starting balance is reduced by the principal portion of linked payments. Interest is not calculated automatically.</p>':sub?'<p class="inline-hint">Trials and future renewals never charge automatically. Record Payment only after money actually leaves. Reminder timing is managed in Settings → Notifications.</p>':'<p class="inline-hint">Due dates follow the original anchor—even after early payment and through shorter months. Reminder timing is managed in Settings → Notifications.</p>'}`,'commitment',`data-kind="${kind}" data-id="${id}"`);}
function targetForm(kind,id=''){const t=E.target(state,id)||{};openDrawer(id?'Edit '+(kind==='fund'?'sinking fund':'goal'):kind==='fund'?'Create sinking fund':'Create goal',kind==='fund'?'A planned future expense, funded month by month.':'A target you want to reach over time.',`${nameField('Name',t.name||'')}<div class="form-row">${amountField('target','Target amount',t.target)}${amountField('opening','Already set aside',t.opening??0)}</div>${amountField('monthly','Monthly contribution intention',t.monthly??0)}${field('date','Target date (optional)',t.date||'','date','min="1900-01-01" max="2200-12-31"')}<label class="checkchip"><input type="checkbox" name="highlight" ${t.highlight!==false?'checked':''}>Highlight on dashboard</label>${!id?'<label class="checkchip"><input type="checkbox" name="addPlan" checked>Add monthly contribution to this month’s plan</label>':''}<p class="inline-hint">Already set aside is an opening savings amount, not income or a new contribution. New contributions should be recorded in Savings.</p>`,'target',`data-kind="${kind}" data-id="${id}"`);}
function targetContributionForm(id){const t=E.target(state,id);if(!t||t.archived)return;const balance=E.targetBalance(state,id),remaining=Math.max(0,t.target-balance);if(!remaining){toast('This target is complete. Archive it when you are ready.');return;}if(!activeAccounts().length){pendingEntry=()=>targetContributionForm(id);accountForm();toast('Add an account before recording a contribution.');return;}openDrawer('Add contribution',`${marked(t.name)} · ${money(balance)} saved · ${money(remaining)} remaining`,`${amountField('amount','Contribution amount')}<div class="contribution-context">${icon('sparkles')}<span>Only the amount is required. The contribution will be recorded as savings, not an expense.</span></div><details class="contribution-options"><summary>Change account or date</summary>${dateField('date','Contribution date',entryDate())}${selectField('accountId','Set aside from account',accountOptions(activeAccounts()[0]?.id),activeAccounts()[0]?.id,'required')}</details>`,'target-contribution',`data-id="${id}"`);}
function paymentForm(kind,id,date){const item=commitmentList(kind).find(x=>x.id===id);if(!item)return;if(kind!=='debt'&&!E.canPay(state,kind,id,date)){toast('This payment is not available yet.');return;}if(!activeAccounts().length){pendingEntry=()=>paymentForm(kind,id,date);accountForm();toast('Add an account before recording payment.');return;}const record=E.occurrenceRecord(state,kind,id,date),amount=record?.expectedAmount??(kind==='debt'?E.plan(state,E.monthOf(date)).debtPayments?.[id]:undefined)??E.changeAmount(item,date),sub=kind==='subscription',title=kind==='bill'?'Pay bill':'Record payment';openDrawer(title,`${marked(item.name)} · ${kind==='subscription'?'billing':'due'} ${dateFmt(date)}`,`<div class="payment-review"><span><small>${kind==='subscription'?'Fixed plan amount':'Expected amount'}</small><b class="num">${money(amount)}</b></span><span><small>${kind==='subscription'?'Billing date':'Due date'}</small><b>${dateFmt(date)}</b></span><span><small>Payment account</small><b>${accountLabel(item.accountId||activeAccounts()[0]?.id)}</b></span></div>${sub?field('amount','',amountInput(amount),'hidden')+`<details><summary>Adjust this payment only</summary>${amountField('adjustedAmount','Amount for this cycle',amount)}</details>`:amountField('amount',kind==='debt'?'Payment amount':'Actual amount',amount)}${dateField('date','Payment date',E.today())}${kind==='debt'?amountField('principal','Principal portion',Math.min(amount,E.debtBalance(state,id))):''}${selectField('accountId','Pay from account',accountOptions(item.accountId),item.accountId||activeAccounts()[0]?.id,'required')}${kind==='bill'&&item.frequency!=='once'?'<label class="checkchip"><input type="checkbox" name="carryForward">Use this actual amount as the next expected amount</label>':''}${field('method','Payment reference (optional)',item.method||'','text','maxlength="80"')}<p class="inline-hint">Confirmation creates exactly one linked expense and deducts the selected account once. ${sub?'This cycle adjustment does not change the plan price.':kind==='debt'?'Only the principal portion reduces the debt balance.':'Older occurrences are never rewritten.'}</p>`,'payment',`data-kind="${kind}" data-id="${id}" data-date="${date}"`);}
function eventForm(id=''){const e=state.events.find(x=>x.id===id)||{};openDrawer(id?'Edit financial event':'Add financial event','A calendar reminder without a financial transaction.',`${nameField('Event name',e.name||'')}${dateField('date','Date',e.date||(page==='calendar'?day:entryDate()))}<div class="field"><label for="f-note">Notes</label><textarea id="f-note" name="note" maxlength="1000">${esc(e.note||'')}</textarea></div>`,'event',`data-id="${id}"`);}
function confirmDialog(title,text,fn,danger=false,typed=''){pendingConfirm=fn;openDrawer(title,'',`<p class="confirm-text">${esc(text)}</p>${typed?field('confirmation',`Type ${typed} to confirm`,'','text',`required autocomplete="off" data-confirm="${typed}"`):''}`,'confirm','',true);if(danger)$('#overlay button[type=submit]').className='button danger';}
let pendingConfirm=null,pendingRestore=null;
function copyForm(){openDrawer('Copy a monthly plan','Copy allocations, expected income, and contribution plans. Actual entries stay in their original month.',`${field('source','Copy from',E.monthAdd(month,-1),'month','required min="1900-01" max="2200-12"')}<div class="callout">${icon('arrow-right')}<span>Copy into ${monthLabel(month)}</span></div><label class="checkchip"><input type="checkbox" name="replace">Replace this month’s existing plan</label><p class="inline-hint">Existing transactions will not change. Copied income sources receive new IDs; relink any existing income entries if replacing a populated plan.</p>`,'copy');}
function toast(message){$('#toast').textContent=window.BudgetI18n?.text(message,lang())||message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3800);}
function showError(err){const message=window.BudgetI18n?.text(err?.message||'Something went wrong. Please try again.',lang())||err.message;const el=$('#overlay .form-error')||$('.lock-card .form-error');if(el)el.textContent=message;else toast(message);}

function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{try{const file=input.files?.[0];if(!file)return;if(file.size>30*1024*1024)throw Error('Backup is too large. Maximum size is 30 MB.');pendingRestore=E.parseBackup(await file.text());const d=pendingRestore;confirmDialog('Restore this backup?',`Replace this workspace with ${d.transactions.length} transactions, ${d.plans.length} monthly plans, ${d.targets.length} savings targets, and ${d.bills.length+d.subscriptions.length+d.debts.length} commitments. Your current PIN stays unchanged. Create a backup first if you need the current data.`,async()=>{await commit(s=>{const rev=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,E.clone(d),{revision:rev});},'Backup restored');pendingRestore=null;},true,'RESTORE');}catch(e){showError(e);}});input.click();}

 if(kind==='commitment'){await commit(s=>{const k=form.dataset.kind,list=k==='bill'?s.bills:k==='subscription'?s.subscriptions:s.debts,old=list.find(x=>x.id===id),amount=positiveAmount(f.amount),date=requireDate(f.date),startDate=requireDate(f.startDate||f.date);if(f.endDate&&(!E.validDate(f.endDate)||f.endDate<date))throw Error('Choose an end date on or after the first due date.');const item={...old,id:id||E.uid(),name:requireName(f.name),amount,date,startDate,frequency:f.frequency,categoryId:f.categoryId,method:f.method||'',note:f.note||'',accountId:f.accountId||'',endDate:f.endDate||'',status:old?.status||'active'};if(k==='debt'){item.balance=positiveAmount(f.balance,true);item.apr=f.apr||'';}else if(k==='bill'){item.initialAmount=old?.initialAmount??old?.amount??amount;item.amountChanges=old?.amountChanges||[];item.reminderDays=(s.settings.notify.billDays||[]).filter(d=>!['weekly','fortnightly'].includes(f.frequency)||d<=1);if(old&&old.amount!==amount)item.amountChanges.push({effectiveDate:E.today(),amount});}else{item.initialAmount=old?.initialAmount??old?.amount??amount;item.priceChanges=old?.priceChanges||[];item.paymentReminderDays=(s.settings.notify.subscriptionDays||[]).filter(d=>f.frequency!=='weekly'||d<=1);item.trialReminderDays=[...(s.settings.notify.trialDays||[])];item.trialType=f.trialType;let trialEnd='';if(f.trialType==='oneMonth')trialEnd=E.dayIn(E.monthAdd(E.monthOf(startDate),1),+startDate.slice(8));else if(f.trialType==='threeMonths')trialEnd=E.dayIn(E.monthAdd(E.monthOf(startDate),3),+startDate.slice(8));else if(f.trialType==='custom')trialEnd=requireDate(f.trialEndDate);if(trialEnd&&date<=trialEnd)throw Error('First paid billing date must be after the free trial ends.');item.trialEndDate=trialEnd;if(old&&old.amount!==amount)item.priceChanges.push({effectiveDate:E.today(),amount});}item.amount=amount;if(old){Object.assign(old,item);if(k==='bill')s.billOccurrences=s.billOccurrences.filter(o=>o.definitionId!==id||o.status==='paid');if(k==='subs  case'delete-income-plan':return confirmDialog('Remove expected income?','Received income stays in your transaction history. Only this planned source is removed.',()=>commit(s=>{E.ensurePlan(s,month).income=E.plan(s,month).income.filter(x=>x.id!==id);for(const t of s.transactions)if(t.incomePlanId===id)t.incomePlanId='';},'Expected income removed'),true);

 case'remove-contribution':return confirmDialog('Remove contribution plan?','Already recorded savings stay unchanged.',()=>commit(s=>{E.ensurePlan(s,month).contributions=E.plan(s,month).contributions.filter(x=>x.id!==id);},'Contribution plan removed'),true);
 case'reset-plan':return confirmDialog('Reset this monthly plan?','Remove expected income, allocations, contribution plans, and planned debt overrides for the selected month. Actual transactions remain.',()=>commit(s=>{s.plans=s.plans.filter(p=>p.month!==month);for(const t of s.transactions.filter(t=>E.monthOf(t.date)===month))t.incomePlanId='';},'Monthly plan reset'),true,'RESET');
 case'archive-category':return commit(s=>{const c=s.categories.find(x=>x.id===id);c.archived=!c.archived;},'Category updated',false);
 case'commitment-details':{const item=commitmentList(kind).find(x=>x.id===id);if(item)return commitmentDetails(kind,item);return;}
 case'pause-commitment':{const list=kind==='subscription'?state.subscriptions:state.bills,c=list.find(x=>x.id===id);if(!c)return;if(c.status==='paused')return openDrawer('Resume '+(kind==='subscription'?'subscription':'bill'),'Choose the next real billing date. Missed periods will not be charged.',dateField('date',kind==='subscription'?'Next billing date':'Next due date',E.dateAdd(E.today(),kind==='subscription'?5:1)),'resume',`data-kind="${kind}" data-id="${id}"`);return commit(s=>{const item=(kind==='subscription'?s.subscriptions:s.bills).find(x=>x.id===id);item.status='paused';},'Schedule paused',!!$('#overlay').firstChild);}
 case'end-commitment':return confirmDialog(kind==='subscription'?'Cancel this subscription?':'End this recurrence?',kind==='subscription'?'Future billing cycles and reminders stop. All payment history stays available.':'Future occurrences and reminders stop. All bill history and expenses stay available.',()=>commit(s=>{const item=(kind==='subscription'?s.subscriptions:s.bills).find(x=>x.id===id);item.status=kind==='subscription'?'cancelled':'ended';item.endedAt=E.today();},kind==='subscription'?'Subscription cancelled':'Recurrence ended'),true);
 case'delete-commitment':return confirmDialog('Delete this '+kind+'?', 'Delete is only available for an unused schedule with no payment history.',()=>commit(s=>{const key=kind==='bill'?'bills':kind==='subscription'?'subscriptions':'debts',hasHistory=s.transactions.some(t=>t.sourceKind===kind&&t.sourceId===id);if(hasHistory)throw Error('This schedule has payment history. End or cancel it instead.');s[key]=s[key].filter(x=>x.id!==id);if(kind==='bill')s.billOccurrences=s.billOccurrences.filter(x=>x.definitionId!==id);if(kind==='subscription')s.subscriptionCycles=s.subscriptionCycles.filter(x=>x.definitionId!==id);},'Commitment deleted'),true);
 case'pause-target':return commit(s=>{const t=E.target(s,id);t.status=t.status==='paused'?'active':'paused';},'Target status updated',false);
 case'archive-target':{const target=E.target(state,id);if(!target)return;return confirmDialog(`Archive completed ${target.kind==='fund'?'fund':'goal'}?`,'The card will move out of your active list. Saved money, contributions, and every linked record remain preserved.',()=>commit(s=>{const t=E.target(s,id);t.archived=true;t.status='paused';t.highlight=false;},'Completed target archived'),true);}
 case'restore-target':return commit(s=>{const t=E.target(s,id);if(!t)return;t.archived=false;t.status='active';},'Target restored',false);
 case'delete-event':return confirmDialog('Delete this event?','This removes the manual reminder only.',()=>commit(s=>{s.events=s.events.filter(x=>x.id!==id);},'Event deleted'),true);
 case'debt-plan':{const d=state.debts.find(x=>x.id===id);return openDrawer('Plan this month’s payment',marked(d.name)+' · '+monthLabel(month),amountField('amount','Planned payment',E.plan(state,month).debtPayments?.[id]??d.amount),'debt-plan',`data-id="${id}"`);}
 case'select-day':day=el.dataset.date;if(E.monthOf(day)!==month)month=E.monthOf(day);return render();case'history-open':month=el.dataset.month;return navigate('dashboard');case'review':return commit(s=>{E.ensurePlan(s,month).reviewed=true;},'Month marked reviewed',false);
 case'tx-prev':txPage=Math.max(1,txPage-1);return render();case'tx-next':txPage++;return render();case'clear-search':filters.search='';txPage=1;return render();case'clear-filters':filters={search:'',type:'all',category:'all'};txPage=1;return render();case'print':return window.print();case'export-csv':return csv();case'export-all':return csv(true);case'backup':return backup();case'restore':return restore();case'data-settings':setting='demo';return navigate('settings');case'setting-tab':setting=el.dataset.key;return render();
 case'currency-option':return commit(s=>{s.settings.currency=el.dataset.code;s.settings.locale=E.localeForCurrency(el.dataset.code);},'Currency updated',false);
 case'save-currency':{const input=$('[data-input="currency-search"]'),query=(input?.value||'').trim(),code=CURRENCY_CODES.find(c=>c.toLowerCase()===query.toLowerCase()||currencyName(c).toLowerCase()===query.toLowerCase());if(!code)throw Error('Choose a supported currency from the list.');return commit(s=>{s.settings.currency=code;s.settings.locale=E.localeForCurrency(code);},'Currency updated',false);}
 case'theme':return commit(s=>{s.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';},'Appearance updated',false);
 case'toggle':{const key=el.dataset.key,group=el.dataset.group;return commit(s=>{if(group==='navigation'){if(s.settings.hidden.includes(key))s.settings.hidden=s.settings.hidden.filter(x=>x!==key);else s.settings.hidden.push(key);}else if(group==='notify')s.settings.notify[key]=!s.settings.notify[key];else s.settings[key]=!s.settings[key];},'Preference saved',false);}
 case'notifications':return notificationDrawer();case'notification-settings':setting='notifications';return navigate('settings');case'notifications-read':await commit(s=>{const ids=new Set(E.visibleNotifications(s).map(x=>x.id));s.notifications.forEach(n=>{if(ids.has(n.id))n.read=true;});},'',false);return notificationDrawer();
 case'notification-read':case'notification-dismiss':case'notification-open':{const note=state.notifications.find(x=>x.id===id);if(!note)return;await commit(s=>{const n=s.notifications.find(x=>x.id===id);if(act==='notification-dismiss')n.dismissed=true;else n.read=true;},'',false);if(act==='notification-open'){const due=note.id.match(/:(\d{4}-\d{2}-\d{2}):reminder/);if(due)month=E.monthOf(due[1]);return navigate(note.route);}return notificationDrawer();}
 case'pin-setup':return pinForm('setup');case'pin-change':return pinForm('change');case'pin-off':return pinForm('off');case'recovery-new':return pinForm('recovery');case'lock':locked=true;return renderLock();case'recovery-mode':recoveryMode=!recoveryMode;return renderLock();case'download-key':return download('Monthly-Budget-Planner-Recovery-Key.txt',`Monthly Budget Planner recovery key\n\n${el.dataset.key}\n\nKeep this private. This unlocks this browser workspace.\n`,'text/plain');
 case'locked-reset':return confirmDialog('Reset this locked workspace?','All Monthly Budget Planner data and PIN settings will be deleted. You can restore financial data only if you have a backup.',async()=>{const fresh=E.defaults();fresh.revision=state.revision;await DB.write(fresh,true,true);state=fresh;security=null;locked=false;closeDrawer();render();},true,'DELETE');
 case'clear-financial':case'clear-all':return confirmDialog(act==='clear-all'?'Delete all app data?':'Clear financial data?',act==='clear-all'?'This resets all records, preferences, categories, and PIN for Monthly Budget Planner. Create a backup first.':'This removes all financial records while preserving your categories, preferences, and PIN. Create a backup first.',async()=>{if(act==='clear-all')setting='general';await commit(s=>{const fresh=E.defaults();if(act==='clear-financial'){fresh.settings=E.clone(s.settings);fresh.categories=E.clone(s.categories);}fresh.revision=s.revision;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,fresh);},'Workspace reset',true,act==='clear-all');},true,'DELETE');
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled){e.preventDefault();if(busy)return;Promise.resolve(action(el)).catch(showError);}else if(e.target.classList.contains('overlay'))closeDrawer();else if(!e.target.closest('.currency-combobox')){const results=$('#currency-results'),input=$('[data-input="currency-search"]');if(results)results.hidden=true;if(input)input.setAttribute('aria-expanded','false');}});
document.addEventListener('submit',async e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();if(busy||form.dataset.submitting)return;form.dataset.submitting='true';const error=form.querySelector('.form-error');if(error)error.textContent='';try{await submit(form);}catch(err){showError(err);}finally{delete form.dataset.submitting;}});
document.addEventListener('change',async e=>{const el=e.target,key=el.dataset.change;if(!key)return;try{if(key==='month'){if(!E.validMonth(el.value))throw Error('Choose a month from 1900 to 2200.');month=el.value;day=month+'-01';txPage=1;render();}
 else if(key==='allocation'){const amount=positiveAmount(el.value,true),id=el.dataset.id;await commit(s=>{const p=E.ensurePlan(s,month),a=p.allocations.find(x=>x.categoryId===id);if(a)a.amount=amount;else p.allocations.push({categoryId:id,amount});},'Allocation updated',false);}
 else if(key==='filter-type'){filters.type=el.value;const category=state.categories.find(c=>c.id===filters.category);if(category&&category.type!==el.value&&el.value!=='all')filters.category='all';if(!['all','income','expense'].includes(el.value))filters.category='all';txPage=1;render();}else if(key==='filter-category'){filters.category=el.value;txPage=1;render();}
 else if(key==='setting'){await commit(s=>{s.settings[el.dataset.key]=el.value;},'Preference saved',false);}
 else if(key==='notify-day'){await commit(s=>{const k=el.dataset.key,v=+el.value;s.settings.notify[k]=el.checked?[...new Set([...s.settings.notify[k],v])]:s.settings.notify[k].filter(x=>x!==v);if(k==='billDays')for(const item of s.bills)item.reminderDays=s.settings.notify[k].filter(d=>!['weekly','fortnightly'].includes(item.frequency)||d<=1);if(k==='subscriptionDays')for(const item of s.subscriptions)item.paymentReminderDays=s.settings.notify[k].filter(d=>item.frequency!=='weekly'||d<=1);if(k==='trialDays')for(const item of s.subscriptions)item.trialReminderDays=[...s.settings.notify[k]];},'Reminder timing saved',false);}
 else if(key==='trial-type'){const fields=el.form?.querySelector('.trial-fields');if(fields)fields.hidden=el.value==='none';if(el.value==='oneMonth'||el.value==='threeMonths'){const start=el.form.elements.startDate.value,months=el.value==='oneMonth'?1:3;if(E.validDate(start)){const trialEnd=E.dayIn(E.monthAdd(E.monthOf(start),months),+start.slice(8));el.form.elements.trialEndDate.value=trialEnd;if(!E.validDate(el.form.elements.date.value)||el.form.elements.date.value<=trialEnd)el.form.elements.date.value=E.dateAdd(trialEnd,1);}}}
 else if(key==='report-period'){reportPeriod=el.value;render();}else if(key==='report-from'||key==='report-to'){requireDate(el.value);const from=key==='report-from'?el.value:reportFrom,to=key==='report-to'?el.value:reportTo;if(from>to)throw Error('Start date must come before the end date.');if(E.daysBetween(from,to)>3660)throw Error('Choose a range of up to 10 years.');reportFrom=from;reportTo=to;render();}
 }catch(err){showError(err);if(key==='allocation')el.value=amountInput(E.monthly(state,month).categories.find(c=>c.id===el.dataset.id)?.budget||0);}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.dataset.input==='search'){filters.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const start=e.target.selectionStart;txPage=1;render();const input=$('[data-input=search]');input?.focus();try{input?.setSelectionRange(start,start);}catch{}},120);}else if(e.target.dataset.input==='currency-search'){const input=e.target,query=input.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,3);input.value=query;const results=$('#currency-results'),open=query.length===3;if(results){results.innerHTML=open?currencyOptions(query):'';results.hidden=!open;}input.setAttribute('aria-expanded',String(open));localize();}});
document.addEventListener('focusin',e=>{if(e.target.dataset.input==='currency-search')e.target.select();});
document.addEventListener('keydown',e=>{if(e.target.dataset.input==='currency-search'){const results=$('#currency-results');if(e.key==='Escape'){if(results)results.hidden=true;e.target.setAttribute('aria-expanded','false');return;}if(e.key==='Enter'&&results&&!results.hidden){const option=results.querySelector('[data-act="currency-option"]');if(option){e.preventDefault();option.click();return;}}}if(!$('#overlay').firstChild)return;if(e.key==='Escape'){closeDrawer();return;}if(e.key==='Tab'){const nodes=[...document.querySelectorAll('#overlay button:not(:disabled),#overlay input:not([type=hidden]):not(:disabled),#overlay select:not(:disabled),#overlay textarea,#overlay summary')].filter(x=>x.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state&&state.settings.theme==='system')applyAppearance();});
try{await DB.open();state=await DB.read();if(state){const beforeState=JSON.stringify(state);state=E.prepareOccurrences(E.migrate(state));if(JSON.stringify(state)!==beforeState){E.validate(state);await DB.write(state);}}if(!state){state=BudgetDemo.seed(E.today());await DB.write(state,false);}else E.validate(state);security=null;await DB.setSecurity(null);const updated=E.clone(state),before=JSON.stringify(updated.notifications);E.refreshNotifications(updated);if(JSON.stringify(updated.notifications)!==before){await DB.write(updated);state=updated;}locked=false;render();if(!BudgetDemo.introSeen()){BudgetDemo.markIntroSeen();openDrawer('Welcome to the interactive demo','Explore the software using realistic sample data.',`<div class="demo-intro"><div class="callout">${icon('sparkles')}<span>Demo uses sample data. Please do not enter real financial information.</span></div><p>You can add, edit, pay, contribute, archive, and delete records freely. Changes stay in this tab during the session and disappear in a new session.</p><p>The purchased version starts with a clean workspace for your own information.</p><div class="form-actions">${btn('Explore Demo','close','arrow-right','primary')}</div></div>`);}setInterval(async()=>{if(locked||busy||document.hidden)return;try{const draft=E.clone(state),before=JSON.stringify(draft.notifications);E.prepareOccurrences(draft);E.refreshNotifications(draft);if(JSON.stringify(draft)!==JSON.stringify(state)&&JSON.stringify(draft.notifications)!==before){await DB.write(draft);state=draft;if(!$('#overlay').firstChild)render();}}catch{}},60000);}catch(err){$('#app').innerHTML=`<main class="startup"><div class="brandmark">${icon('database')}</div><h1>We couldn’t open your workspace</h1><p>${esc(err.message)}</p><p>Use a regular browser window with IndexedDB enabled. Your existing data has not been cleared.</p><button class="button primary" onclick="location.reload()">Try again</button></main>`;localize();}
})();
</script></body></html>
